services:
  web:
    image: ${IMAGE_NAME:-ghcr.io/YOUR_GITHUB_USERNAME/tyndfed}:${IMAGE_TAG:-latest}
    container_name: tyndfed
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tyndfed.rule=Host(`${TRAEFIK_HOST:-tyndfed.dk}`)"
      - "traefik.http.routers.tyndfed.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.tyndfed.tls=true"
      - "traefik.http.routers.tyndfed.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.tyndfed.loadbalancer.server.port=80"
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - saltbox

networks:
  saltbox:
    external: true
