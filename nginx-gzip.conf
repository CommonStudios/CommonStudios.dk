gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_http_version 1.1;
gzip_types
  text/plain
  text/css
  text/javascript
  text/xml
  application/javascript
  application/json
  application/xml
  application/xml+rss
  application/rss+xml
  application/atom+xml
  image/svg+xml
  font/ttf
  font/otf
  application/font-woff
  application/font-woff2;

# Expires/Cache-Control policies by response content type.
map $sent_http_content_type $expires_by_type {
  default off;
  text/html -1;
  text/css 365d;
  application/javascript 365d;
  text/javascript 365d;
  image/svg+xml 365d;
  ~image/ 30d;
  ~font/ 365d;
}

map $sent_http_content_type $cache_control_by_type {
  default "public, max-age=3600";
  text/html "no-cache";
  text/css "public, max-age=31536000, immutable";
  application/javascript "public, max-age=31536000, immutable";
  text/javascript "public, max-age=31536000, immutable";
  image/svg+xml "public, max-age=31536000, immutable";
  ~image/ "public, max-age=2592000";
  ~font/ "public, max-age=31536000, immutable";
}

expires $expires_by_type;
add_header Cache-Control $cache_control_by_type always;
